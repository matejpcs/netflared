# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Java CI with Gradle

on:
  # Manual trigger only — click "Run workflow" in the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history so `git log --since` works across the cutoff.
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Force the wrapper to Gradle 9.5.0 before anything tries to configure
    # the build. Fabric Loom 1.17.x requires Gradle 9.5.0, so 9.1.0 fails.
    - name: Force wrapper to Gradle 9.5.0
      run: |
        if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
        else
          echo "No wrapper properties found — will generate fresh via 'gradle wrapper'."
        fi

    - name: Setup Gradle (standalone, for wrapper generation)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.5.0'

    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper --gradle-version 9.5.0
        fi
        chmod +x ./gradlew

    - name: Show Gradle version
      run: ./gradlew --version

    - name: Build with Gradle Wrapper
      run: ./gradlew build --no-daemon

    - name: Build changelog from last 24h of commits
      id: changelog
      run: |
        LOG=$(git log --since="24 hours ago" --pretty=format:'- %s (%h) — %an' || true)
        if [ -z "$LOG" ]; then
          LOG="- No commits in the last 24 hours."
        fi
        {
          echo 'changelog<<EOF'
          echo "$LOG"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Publish Beta Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-beta
        name: "Beta build #${{ github.run_number }}"
        prerelease: true
        body: |
          ## Beta release
          **Commit:** ${{ github.sha }}
          **Triggered by:** @${{ github.actor }}

          ### Commits in the last 24 hours
          ${{ steps.changelog.outputs.changelog }}
        files: |
          build/libs/*.jar
