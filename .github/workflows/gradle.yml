# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Java CI with Gradle

on:
  # Run every 2 days at 03:00 UTC
  schedule:
    - cron: '0 3 */2 * *'
  # Allow manual runs (the "Re-run jobs" button on a completed run
  # will also re-execute this workflow with the same inputs)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Only need enough history for the last day's commits.
        # A shallow-ish fetch is faster and sufficient for `git log --since`.
        fetch-depth: 0   # keep 0 so `--since` works across the cutoff

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Install a standalone Gradle so we can generate the wrapper
    - name: Setup Gradle (standalone, for wrapper generation)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'   # supports JDK 25

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 9.1.0
        chmod +x ./gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build --no-daemon

    - name: Build changelog from last 24h of commits
      id: changelog
      run: |
        LOG=$(git log --since="24 hours ago" --pretty=format:'- %s (%h) — %an' || true)
        if [ -z "$LOG" ]; then
          LOG="- No commits in the last 24 hours."
        fi
        {
          echo 'changelog<<EOF'
          echo "$LOG"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Publish Beta Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}-beta
        name: "Beta build #${{ github.run_number }}"
        prerelease: true
        body: |
          ## Beta release
          **Commit:** ${{ github.sha }}
          **Triggered by:** @${{ github.actor }}

          ### Commits in the last 24 hours
          ${{ steps.changelog.outputs.changelog }}
        files: |
          build/libs/*.jar
