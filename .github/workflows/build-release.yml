name: Build and Release Both Versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout neo-1.21.1
        uses: actions/checkout@v4
        with:
          ref: neo-1.21.1
          path: neo-1.21.1

      - name: Set up Java 25 for main
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.0 for main
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Generate Gradle 9.5.0 wrapper for main
        working-directory: main
        run: gradle wrapper --gradle-version 9.5.0

      - name: Build main with Gradle wrapper
        working-directory: main
        run: ./gradlew clean build --no-daemon

      - name: Set up Java 21 for neo-1.21.1
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up isolated Gradle 9.2.1 for neo-1.21.1
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-neo
        with:
          gradle-version: '9.2.1'
          cache-disabled: true

      - name: Resolve NeoForge dependencies
        working-directory: neo-1.21.1
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-neo
        run: gradle dependencies --configuration compileClasspath --no-daemon --no-parallel --no-configuration-cache --refresh-dependencies

      - name: Inspect NeoForge userdev artifact
        working-directory: neo-1.21.1
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-neo
        run: |
          set -e
          echo "=== NeoForge 21.1.235 artifacts ==="
          find "${GRADLE_USER_HOME}/caches/modules-2/files-2.1/net.neoforged/neoforge/21.1.235" -type f -name '*.jar' -print

          echo "=== userdev artifact access transformer ==="
          userdev_found=false
          while IFS= read -r jar; do
            userdev_found=true
            echo "--- ${jar}"
            unzip -l "${jar}" | grep -E 'ats/accesstransformer.cfg|config.json' || true
            unzip -t "${jar}" >/dev/null
          done < <(find "${GRADLE_USER_HOME}/caches/modules-2/files-2.1/net.neoforged/neoforge/21.1.235" -type f -name '*-userdev.jar')

          if [ "${userdev_found}" = false ]; then
            echo "ERROR: NeoForge 21.1.235 userdev jar was not resolved."
            exit 1
          fi

      - name: Build neo-1.21.1
        working-directory: neo-1.21.1
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-neo
        run: gradle clean build --no-daemon --no-parallel --no-configuration-cache --refresh-dependencies -Dorg.gradle.caching=false -Pneogradle.subsystems.decompiler.enabled=false

      - name: Prepare release artifacts
        run: |
          set -e
          mkdir -p release
          find main/build/libs neo-1.21.1/build/libs -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;

          echo "=== Release artifacts ==="
          find release -maxdepth 1 -type f -name '*.jar' -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" release/*.jar             --repo matejpcs/netflared             --title "Netflared build $TAG"             --notes "Automated build of both branches.

          - main: built with Java 25 and Gradle 9.5.0 wrapper
          - neo-1.21.1: built with Java 21 and Gradle 9.2.1

          Main commit: $(git -C main rev-parse HEAD)
          NeoForge 1.21.1 commit: $(git -C neo-1.21.1 rev-parse HEAD)"
