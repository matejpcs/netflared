name: Build and Release Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Generate Gradle 9.5.0 wrapper
        working-directory: main
        run: gradle wrapper --gradle-version 9.5.0

      - name: Build main with Gradle wrapper
        working-directory: main
        run: ./gradlew clean build --no-daemon

      - name: Prepare release artifact
        run: |
          set -e
          mkdir -p release
          find main/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;

          echo "=== Release artifacts ==="
          find release -maxdepth 1 -type f -name '*.jar' -print

      - name: Collect release notes
        run: |
          {
            echo "Automated build of the main branch."
            echo
            echo "- Built with Java 25 and Gradle 9.5.0 wrapper"
            echo "- Commit: $(git -C main rev-parse HEAD)"
            echo
            echo "### Recent commits"
            git -C main log -n 20 --pretty=format:'- %h %s'
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" release/*.jar \
            --repo matejpcs/netflared \
            --title "Netflared build $TAG" \
            --notes-file release-notes.md
